server {
    listen 80;
    listen [::]:80;
    server_name projetos.baselider.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name projetos.baselider.com.br;

    # Use um Cloudflare Origin Certificate neste servidor.
    ssl_certificate /etc/ssl/cloudflare/projetos.baselider.com.br.pem;
    ssl_certificate_key /etc/ssl/cloudflare/projetos.baselider.com.br.key;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
