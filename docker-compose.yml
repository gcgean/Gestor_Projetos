services:
  postgres:
    image: postgres:16-alpine
    container_name: gestor_projetos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestor_projetos
    ports:
      - "5432:5432"
    volumes:
      - gestor_projetos_pgdata:/var/lib/postgresql/data

volumes:
  gestor_projetos_pgdata:
